name: Release

# Push a tag like v2.0.0 to build the exe, attach it to a GitHub release and,
# when set up, upload it as a new version of the file on Nexus Mods.
#
# Nexus Mods setup (once, in the GitHub repository settings):
#   Settings > Secrets and variables > Actions
#   - secret   NEXUSMODS_API_KEY  - key from https://www.nexusmods.com/settings/api-keys
#   - variable NEXUS_FILE_ID      - ID of the existing file on the mod page
#                                   (Files tab > the file's "Advanced" option)
# Without the variable the Nexus steps are skipped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/rimworld-mod-manager.exe
          generate_release_notes: true

      - name: Pack for Nexus Mods
        id: pack
        if: ${{ vars.NEXUS_FILE_ID != '' }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "RimWorldModManager-$version.zip"
          Compress-Archive -Path target/release/rimworld-mod-manager.exe -DestinationPath $zip
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      # The GitHub release above is already done; a Nexus failure doesn't undo it.
      - name: Upload to Nexus Mods
        if: ${{ vars.NEXUS_FILE_ID != '' }}
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ steps.pack.outputs.zip }}
          version: ${{ steps.pack.outputs.version }}
          category: main
          update_mod_version: true
