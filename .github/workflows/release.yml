name: Release

# Push a tag like v2.0.0 to build the exe (and, in the `linux` job, the Linux .tar.gz and
# AppImage, added to the same release), attach it to a GitHub release and
# upload it to Nexus Mods as a new version of the main file, next to the previous
# one (which is not archived automatically). The bullet list of
# the tagged version commit becomes the Nexus changelog for that version.
#
# Before anything is published: the tag must match the Cargo.toml version, and
# formatting, clippy and the tests must pass (the same checks as CI). After the
# build the exe is checked (present, not empty, right version) and its SHA-256
# is attached next to it.
#
# Nexus Mods setup (repository Settings > Secrets and variables > Actions):
#   - secret   NEXUSMODS_API_KEY  - key from https://www.nexusmods.com/settings/api-keys
#   - variable NEXUS_FILE_ID      - File ID of the main file (its "Advanced" menu)
# Without the variable the Nexus upload is skipped (with a notice); the zip for a
# manual upload is kept with the run as an artifact either way.
#
# A release that shouldn't go to Nexus at all: put a line `Skip-Nexus: true` in the body of
# the tagged version commit. The GitHub release is made as usual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The tag must name the version the exe carries (Cargo.toml).
      - name: Tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $line.Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Output "::error title=Version mismatch::Tag v$tag doesn't match the Cargo.toml version $cargo"
            exit 1
          }
          "version=$cargo" >> $env:GITHUB_OUTPUT

      # Same checks as CI: a tag on a broken commit never becomes a release.
      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      # The exe is there, not empty and carries this version; its SHA-256 is published with it.
      - name: Check the exe
        shell: pwsh
        run: |
          $exe = "target/release/rimworld-mod-manager.exe"
          $version = "${{ steps.version.outputs.version }}"
          if (-not (Test-Path $exe)) {
            Write-Output "::error title=No exe::$exe was not built"
            exit 1
          }
          $item = Get-Item $exe
          if ($item.Length -lt 1MB) {
            Write-Output "::error title=Exe too small::$exe is only $($item.Length) bytes"
            exit 1
          }
          $fileVersion = "$($item.VersionInfo.FileVersion)"
          if (-not $fileVersion.StartsWith($version)) {
            Write-Output "::error title=Wrong exe version::The exe says '$fileVersion', expected $version"
            exit 1
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rimworld-mod-manager.exe" | Out-File -Encoding ascii "$exe.sha256"
          "Built rimworld-mod-manager.exe $version ($([math]::Round($item.Length / 1MB, 1)) MB), SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/rimworld-mod-manager.exe
            target/release/rimworld-mod-manager.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Pack for Nexus Mods
        id: pack
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "RimWorldModManager-$version.zip"
          Copy-Item assets/fonts/OFL.txt Montserrat-OFL.txt
          Compress-Archive -Path target/release/rimworld-mod-manager.exe, Montserrat-OFL.txt -DestinationPath $zip
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          # Changelog: the body of the tagged commit without trailer lines.
          $body = @(git log -1 --format=%b $env:GITHUB_SHA)
          $notes = ($body |
            Where-Object { $_ -notmatch '^\s*(Co-Authored-By|Automated-by|Skip-Nexus):' }) -join "`n"
          # `Skip-Nexus: true` in the commit: this release is not uploaded to Nexus.
          $skip = [bool]($body | Where-Object { $_ -match '^\s*Skip-Nexus:\s*true\s*$' })
          "skip_nexus=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "changelog<<NOTES_END" >> $env:GITHUB_OUTPUT
          $notes.Trim() >> $env:GITHUB_OUTPUT
          "NOTES_END" >> $env:GITHUB_OUTPUT

      # The zip for a manual Nexus upload, kept with the run.
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-zip
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

      # The GitHub release above is already done; a Nexus failure doesn't undo it,
      # but it is reported below so it doesn't go unnoticed.
      - name: Upload to Nexus Mods
        id: nexus
        if: ${{ vars.NEXUS_FILE_ID != '' && steps.pack.outputs.skip_nexus != 'true' }}
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ steps.pack.outputs.zip }}
          version: ${{ steps.pack.outputs.version }}
          display_name: Rimworld Mod Manager
          category: main
          # The previous version stays downloadable while Nexus checks the new one
          # (about a day); archive it by hand once the new one is approved.
          archive_existing_version: false
          update_mod_version: true
          # "Unique Mod ID" from the file's "Advanced" menu (public, not a secret)
          mod_id: "1821066134328"
          changelog: ${{ steps.pack.outputs.changelog }}

      - name: Nexus upload failed
        if: ${{ steps.nexus.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Output "::warning title=Nexus Mods::The upload failed. The GitHub release is fine; upload the nexus-zip artifact of this run by hand."
          "Nexus Mods upload FAILED: upload the nexus-zip artifact by hand." >> $env:GITHUB_STEP_SUMMARY

      - name: Nexus upload skipped on purpose
        if: ${{ steps.pack.outputs.skip_nexus == 'true' }}
        shell: pwsh
        run: |
          Write-Output "::notice title=Nexus Mods::Skipped: the version commit says Skip-Nexus: true. The nexus-zip artifact of this run can be uploaded by hand later."
          "Nexus Mods upload skipped on purpose (Skip-Nexus: true in the version commit)." >> $env:GITHUB_STEP_SUMMARY

      - name: Nexus upload skipped
        if: ${{ vars.NEXUS_FILE_ID == '' }}
        shell: pwsh
        run: |
          Write-Output "::notice title=Nexus Mods::Skipped: the NEXUS_FILE_ID variable is not set. Upload the nexus-zip artifact of this run by hand."
          "Nexus Mods upload skipped (NEXUS_FILE_ID not set): upload the nexus-zip artifact by hand." >> $env:GITHUB_STEP_SUMMARY

  # The Linux build, added to the same GitHub release once the Windows job has made it:
  # a .tar.gz and an AppImage (packaging/linux/package.sh) with their SHA-256. Nexus gets
  # the Windows zip only. Ubuntu 22.04: its older glibc lets the binary run on more systems.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The Linux code paths differ from Windows: checked on their own before publishing.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Pack
        run: sh packaging/linux/package.sh target/release/rimworld-mod-manager "${{ steps.version.outputs.version }}" dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rimworld-mod-manager-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/rimworld-mod-manager-${{ steps.version.outputs.version }}-x86_64.AppImage
            dist/rimworld-mod-manager-${{ steps.version.outputs.version }}-linux.sha256
          fail_on_unmatched_files: true
