name: Release

# Push a tag like v2.0.0 to build the exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/rimworld-mod-manager.exe
          generate_release_notes: true
