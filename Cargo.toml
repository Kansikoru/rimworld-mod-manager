[package]
name = "rimworld-mod-manager"
version = "2.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["Kansikoru", "Anry2323"]
description = "Mod and load order manager for RimWorld 1.6 and 1.7"
license = "MIT"
repository = "https://github.com/Kansikoru/rimworld-mod-manager"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
image_dds = "0.7"
rayon = "1.10"
walkdir = "2.5"
quick-xml = "0.36"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
open = "5.3"
rfd = "0.15"
libloading = "0.8"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# No panic = "abort": the texture optimizer relies on catch_unwind so one broken
# image cannot take the whole app down.
strip = true
